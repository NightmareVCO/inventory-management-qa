name: CI - Test Backend PR Changes

on:
  push: { branches: [ dev ] }
  pull_request: { branches: [ dev ] }

jobs:
  dev:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build and run with Compose
        run: |
            docker compose -f docker/dev/docker-compose.ci.yml \
            up --build --abort-on-container-exit

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: 'unit and integration test reports'
          path: 'backend-tests-reports/'

      - name: Tear down
        if: always()
        run: |
            docker compose -f docker/dev/docker-compose.ci.yml \
            down -v --remove-orphans