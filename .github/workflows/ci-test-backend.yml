name: CI - Test Backend PR Changes

on:
  pull_request: { branches: [ dev ] }

jobs:
  dev:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run tests with Compose
        run: |
            docker compose -f docker/dev/docker-compose-ci.yml \
            up --build --abort-on-container-exit

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 'dev-backend-test-reports'
          path: 'backend-tests-reports/'