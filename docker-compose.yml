services:
  inventory-db:
    image: postgres:17.5-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: inventory-db
    ports:
      - "${DB_PORT:-5432}:${DB_PORT:-5432}" # TODO: Must be changed later
    healthcheck:
      test: [ "CMD-SHELL", "sh -c 'pg_isready -U ${POSTGRES_USER:-postgres} -d inventory-db'" ]
      interval: 10s
      timeout: 3s
      retries: 3

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-password}@inventory-db:${DB_PORT:-5432}/inventory-db?sslmode=disable"
    depends_on:
      - inventory-db
    ports:
     - "9187:9187"

  pg-admin:
    image: dpage/pgadmin4
    restart: always
    ports:
      - 8083:80
    environment:
      PGADMIN_DEFAULT_EMAIL: ${POSTGRES_EMAIL:-admin@email.com}
      PGADMIN_DEFAULT_PASSWORD: ${POSTGRES_PASSWORD:-password}
    depends_on:
      - inventory-db

  prometheus:
    image: prom/prometheus
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./server/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - postgres-exporter

  keycloak-auth:
    image: quay.io/keycloak/keycloak:26.2.5
    environment:
      KC_HOSTNAME: ${KEYCLOAK_HOSTNAME:-localhost}
      KC_HOSTNAME_PORT: ${KEYCLOAK_PORT:-7080}
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN_USER:-admin}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:-admin}
      KC_HEALTH_ENABLED: "true"
      KC_LOG_LEVEL: info
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./inventory-realm-realm.json:/opt/keycloak/data/import/realm.json
    ports:
      - "${KEYCLOAK_PORT:-7080}:${KEYCLOAK_PORT:-7080}" # TODO: Must be changed later
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://${KEYCLOAK_HOSTNAME:-localhost}:${KEYCLOAK_PORT:-7080}/health/ready" ]
      interval: 15s
      timeout: 2s
      retries: 15
    command: [ "start-dev", "--http-port", "${KEYCLOAK_PORT:-7080}", "--import-realm" ]

volumes:
  keycloak_data:
