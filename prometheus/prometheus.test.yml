global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'test-fuji-inventory'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['inventory-backend:8080']
  - job_name: 'test-inventory-db'
    static_configs:
      - targets: ['postgres-exporter:9187']